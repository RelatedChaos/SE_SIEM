{% extends "base.html" %}

{% block content %}
    <div class="form-container">
        <h1>Create New Orchestration</h1>
        <form action="/save_orchestration" method="post">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="description">Desctiption</label>
                <input type="text" id="description" name="description" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="code">Code</label>
                <textarea id="code" name="code" class="form-control code-box" rows="15" required></textarea>
            </div>
            <div class="form-group">
                <label for="type">Type</label>
                <select id="type" name="type" class="form-control" required>
                    <option value="automatic">Automatic</option>
                    <option value="manual">Manual</option>
                    <option value="both">Both</option>
                </select>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-save">Save</button>
            </div>
        </form>
    </div>

    <style>
        .form-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .form-container h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #007BFF;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .code-box {
            resize: vertical; /* Allow only vertical resizing */
            overflow: auto; /* Ensure scrolling for long code */
            font-family: monospace; /* Monospace font for code */
        }
        .form-group label {
            display: block;
            font-size: 1rem;
            color: #333;
            margin-bottom: 5px;
        }
        .form-control {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .form-control:focus {
            border-color: #007BFF;
            outline: none;
        }
        .form-actions {
            text-align: center;
            margin-top: 20px;
        }
        .btn-save {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn-save:hover {
            background-color: #0056b3;
        }
    </style>
{% endblock %}
