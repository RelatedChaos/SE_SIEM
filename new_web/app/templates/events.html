{% extends "base.html" %}

{% block content %}
<div class="filter-container">
    <form action="/events" method="get">
        <input type="text" name="filter" value="{{ filter_text }}" placeholder="Filter events..." class="filter-input">
        <button type="submit" class="btn-filter">Apply Filter</button>
    </form>
</div>

<div class="table-container">
    <table class="events-table">
        <thead>
            <tr>
                <th>Event ID</th>
                <th>Message</th>
                <th>Raw</th>
                <th>Time</th>
            </tr>
        </thead>
        <tbody>
            {% for event in events %}
            <tr>
                <td>{{ event.event_id }}</td>
                <td>{{ event.message }}</td>
                <td>{{ event.raw }}</td>
                <td>{{ event.time }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>


<style>
    .filter-container {
        margin: 20px 0;
        display: flex;
        justify-content: left;
        align-items: left;
        gap: 10px;
    }

    .filter-input {
        padding: 10px;
        font-size: 1rem;
        width: 300px;
        border: 1px solid #ddd;
        border-radius: 5px;
    }

    .btn-filter {
        padding: 10px 15px;
        background-color: #007BFF;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    .btn-filter:hover {
        background-color: #0056b3;
    }

    .pagination-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin: 20px 0;
    }

    .pagination-container button {
        padding: 10px 15px;
        background-color: #007BFF;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .pagination-container button:disabled {
        background-color: #ddd;
        cursor: not-allowed;
    }

    .pagination-container button:hover:not(:disabled) {
        background-color: #0056b3;
    }

    .pagination-container span {
        font-size: 1.2rem;
        font-weight: bold;
    }
</style>
{% endblock %}
